<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Hunter</title>
    
    <!-- Link to your manifest file so it can be installed on phones -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #f96302; /* Home Depot Orange */
        }
        button {
            background-color: #f96302;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #d15000;
        }
        #community-intel-list {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>Penny Hunter 🎯</h1>
    
    <!-- The Button -->
    <button onclick="fetchCommunityDeals()">📡 LIVE COMMUNITY INTEL</button>

    <!-- The Box Where Reddit Deals Appear -->
    <div id="community-intel-list">
        <p style="text-align:center; color:#666;">Press the button to scan for recent clearance and penny deals.</p>
    </div>

    <!-- Link to your JavaScript -->
    <script src="app.js"></script>
</body>
</html>
